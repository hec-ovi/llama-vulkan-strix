name: llama-rocmfp4-strix

# Compatibility entry point. The ROCmFP4 + MTP stack is now the default in
# docker-compose.yml, so plain `docker compose up -d` starts the same service.

services:
  rocmfp4-llm:
    extends:
      file: docker-compose.yml
      service: llm

networks:
  llmnet:
    driver: bridge

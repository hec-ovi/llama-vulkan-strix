# Qwen3.6-35B-A3B heretic Q8_0.
# Use with the default stack:
#   COMPOSE_FILE=docker-compose.yml:compose/models/qwen3.6-35b-heretic.yml
#   docker compose up -d
#
# Uncomment the matching block in .env.
# This GGUF is the non-MTP-preserved heretic quant (no draft-mtp flags).

services:
  llm:
    command:
      - --model
      - /models/${LLM_MODEL:?set LLM_MODEL in .env to a GGUF file path relative to MODELS_DIR}
      - --alias
      - ${LLM_ALIAS:-llm}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "${LLM_NGL:-99}"
      - --ctx-size
      - "${LLM_CTX_TOTAL:-655360}"
      - --parallel
      - "${LLM_PARALLEL:-5}"
      - --no-kv-unified
      - --jinja
      - --reasoning
      - "off"
      - --cache-ram
      - "0"
      - --chat-template-file
      - /models/${LLM_CHAT_TEMPLATE:?set LLM_CHAT_TEMPLATE in .env to a jinja file path relative to MODELS_DIR}
      - --flash-attn
      - "on"
